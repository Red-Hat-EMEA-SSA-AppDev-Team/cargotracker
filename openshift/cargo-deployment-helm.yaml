apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: cargo-pipeline-gitops
  name: cargo-pipeline-gitops
spec:
  progressDeadlineSeconds: 600
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: cargo-pipeline-gitops
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        alpha.image.policy.openshift.io/resolve-names: '*'
      labels:
        app: cargo-pipeline-gitops
        deployment: cargo-pipeline-gitops
    spec:
      containers:
      - image: cargo-pipeline:v1
        imagePullPolicy: IfNotPresent
        name: cargo-pipeline-gitops
        ports:
        - containerPort: 8080
          protocol: TCP
        - containerPort: 8443
          protocol: TCP
        - containerPort: 8778
          protocol: TCP
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
